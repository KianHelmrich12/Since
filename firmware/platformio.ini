; since – PlatformIO-Konfiguration
; Envs:
;   ee04   – Seeed XIAO ePaper Display Board EE04 (XIAO ESP32-S3 Plus), Arduino Core 3.x
;   native – Host-Build für Unity-Tests der hardwarefreien Bibliothek since_core

[platformio]
default_envs = ee04

[env]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@^7.4.2

[env:ee04]
; pioarduino-Fork von platform-espressif32: liefert Arduino-ESP32 Core 3.x
; (die offizielle PlatformIO-Plattform bleibt bei Core 2.x). Version fest gepinnt.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
; Board-Definition „Seeed Studio XIAO ESP32S3 Plus“ (16 MB Flash, OPI-PSRAM, USB-CDC aktiv).
; Partitionstabelle (OTA + LittleFS) wird in Phase 6 festgelegt.
board = seeed_xiao_esp32_s3_plus
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DSINCE_NATIVE=1
    '-DSINCE_FIXTURES_DIR="${PROJECT_DIR}/../shared/fixtures"'
