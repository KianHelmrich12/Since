name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Host-Tests (since_core)
        run: pio test -e native
      - name: Firmware bauen
        run: pio run -e ee04
      - name: LittleFS-Image bauen
        run: pio run -e ee04 -t buildfs
      - name: Geräte-Emulator (Fonts + Durchlauf)
        run: |
          pip install pillow
          python3 tools/emulator_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/.pio/build/ee04/firmware.bin
            firmware/.pio/build/ee04/firmware.factory.bin
            firmware/.pio/build/ee04/littlefs.bin

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Format prüfen
        run: npx prettier --check src
      - name: Unit- und Kontrakttests
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Cacht Gradle-Abhängigkeiten zwischen Läufen; ohne Cache lädt jeder Lauf alles neu
      # von Maven Central (führte zu 429 Too Many Requests).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Debug-APK bauen
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: since-app-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
